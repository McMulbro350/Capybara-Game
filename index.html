<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Capybara Jelly Dodge</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="game-wrapper">
    <div id="game-container">

      <!-- Score / Best HUD -->
      <div id="hud">
        <span id="score-display">Score: 0</span>
        <span id="best-display">Best: 0</span>
      </div>

      <!-- Main game canvas: everything (background, lanes, capybara, jelly beans) is drawn here -->
      <canvas id="game-canvas" width="360" height="640"></canvas>

      <!-- On-screen controls, overlaid near the bottom of the game area -->
      <div id="controls">
        <button id="btn-left" class="control-btn" aria-label="Move left">&larr; Left</button>
        <button id="btn-right" class="control-btn" aria-label="Move right">Right &rarr;</button>
      </div>

      <!-- Start screen overlay -->
      <div id="start-screen" class="overlay-screen">
        <h1 class="game-title">Capybara<br>Jelly Dodge</h1>

        <!-- Simple original capybara mascot, drawn as inline SVG -->
        <svg class="capybara-preview" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="60" cy="45" rx="16" ry="16" fill="#C99A6B"/>
          <ellipse cx="140" cy="45" rx="16" ry="16" fill="#C99A6B"/>
          <ellipse cx="60" cy="45" rx="8" ry="8" fill="#8C6845"/>
          <ellipse cx="140" cy="45" rx="8" ry="8" fill="#8C6845"/>
          <ellipse cx="100" cy="95" rx="75" ry="58" fill="#D8AE7E"/>
          <ellipse cx="35" cy="140" rx="14" ry="10" fill="#D8AE7E"/>
          <ellipse cx="165" cy="140" rx="14" ry="10" fill="#D8AE7E"/>
          <circle cx="78" cy="85" r="6" fill="#3A2A1D"/>
          <circle cx="122" cy="85" r="6" fill="#3A2A1D"/>
          <ellipse cx="100" cy="105" rx="10" ry="7" fill="#8C6845"/>
        </svg>

        <p class="level-label">Level 1 &mdash; Easy</p>
        <button id="btn-play" class="menu-btn">Play</button>
      </div>

      <!-- Game over overlay (hidden until the player loses) -->
      <div id="game-over-screen" class="overlay-screen hidden">
        <h2 class="game-title small">Game Over!</h2>
        <p id="final-score" class="final-stat">Score: 0</p>
        <p id="final-best" class="final-stat">Best: 0</p>
        <button id="btn-play-again" class="menu-btn">Play Again</button>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
